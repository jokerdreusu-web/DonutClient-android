
name: Build DonutClient APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DonutClient-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: donutclient-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f DonutClient-Android-Source.zip
          unzip -q -o DonutClient-Android-Source.zip -d .
          test -f DonutClient/settings.gradle.kts
          test -f DonutClient/build.gradle.kts
          test -f DonutClient/app/build.gradle.kts
          test -f DonutClient/app/src/main/AndroidManifest.xml

      - name: Align Java and Kotlin versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("DonutClient/app/build.gradle.kts")
          content = path.read_text()

          if "compileOptions" not in content:
              content = content.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          path.write_text(content)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p DonutClient assembleDebug

      - name: Verify APK exists
        shell: bash
        run: test -s DonutClient/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonutClient-debug-apk
          path: DonutClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
