name: Build DonutClient APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DonutClient-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: donutclient-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f DonutClient-Android-Source.zip
          unzip -q -o DonutClient-Android-Source.zip -d .
          test -f DonutClient/settings.gradle.kts
          test -f DonutClient/build.gradle.kts
          test -f DonutClient/app/build.gradle.kts
          test -f DonutClient/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p DonutClient assembleDebug

      - name: Verify APK exists
        shell: bash
        run: test -s DonutClient/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DonutClient-debug-apk
          path: DonutClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
